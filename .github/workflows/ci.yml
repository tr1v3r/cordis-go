name: ci

on:
  push:
    # `dev` is the day-to-day branch; without it a push there runs no CI.
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Must be at least the `go` directive in go.mod: the sources use
          # generic methods, a Go 1.27 language feature, and the lint tools are
          # rebuilt from source so their parsers understand it too.
          go-version: '1.27.x'
      - name: Install lint tools
        run: make tools
      - name: Put the installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint and test
        run: make ci
