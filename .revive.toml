# revive configuration: the tool's default rule set plus a 100-column limit.
# `make lint` and CI run revive with this file.
#
# Keep the revive pin in `make tools` and .github/workflows/ci.yml in step with
# the Go version in go.mod: a revive binary built with an older Go cannot parse
# generic methods and reports the affected files as syntax errors.

ignore-generated-header = false
severity = "warning"
confidence = 0.8
error-code = 0
warning-code = 0

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.exported]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unreachable-code]
[rule.unused-parameter]
[rule.var-declaration]
[rule.var-naming]

[rule.line-length-limit]
  arguments = [100]
